apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service-blue
  namespace: gateway-service
  labels:
    app: gateway-service
    version: blue
spec:
  replicas: 10
  selector:
    matchLabels:
      app: gateway-service
      version: blue
  template:
    metadata:
      labels:
        app: gateway-service
        version: blue
    spec:
      containers:
        - name: gateway-service-container
          image: docker.io/library/gateway-service:latest
          imagePullPolicy: "Never" # for local in minikube
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
