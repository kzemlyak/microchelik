apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service-blue
  labels:
    app: user-service
    version: blue
spec:
  replicas: 4
  selector: # какие поды нужно поддерживать
    matchLabels:
      app: user-service
      version: blue
  template: # для подов (Pod)
    metadata:
      labels:
        app: user-service
        version: blue
    spec:
      containers:
        - name: user-service-container
          image: docker.io/library/user-service:latest
          imagePullPolicy: "Never" # for local in minikube
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
